<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Master-Detail Pattern: Remote Java Jobs</title>

  <script>
    let jobsData = [];

    async function loadJobs() {
      const selectBox = document.querySelector("#jobSelect");
      selectBox.innerHTML = '<option value="">Loading jobs...</option>';

      try {
        const response = await fetch("https://jobicy.com/api/v2/remote-jobs?geo=usa&tag=java");

        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }

        const resp = await response.json();
        jobsData = resp.jobs || [];

        selectBox.innerHTML = '<option value="">-- Select a Job Title --</option>';

        jobsData.forEach((job, index) => {
          const option = document.createElement("option");
          option.value = index;
          option.textContent = job.jobTitle;
          selectBox.appendChild(option);
        });
      } catch (error) {
        console.error("Error fetching job data:", error);
        selectBox.innerHTML = '<option value="">Failed to load job titles</option>';
      }
    }

    function showJobDetails() {
      const selectBox = document.querySelector("#jobSelect");
      const selectedIndex = selectBox.value;
      const detailsBody = document.querySelector("#jobDetailsTable tbody");


      detailsBody.innerHTML = "";

      if (selectedIndex === "") {
        return;
      }

      const job = jobsData[selectedIndex];

      const details = [
        { label: "Job Title", value: job.jobTitle },
        { label: "Company", value: job.companyName },
        { label: "Category", value: job.jobGeo || "USA" },
        { label: "Job Type", value: Array.isArray(job.jobType) ? job.jobType.join(", ") : job.jobType },
        { label: "Publication Date", value: job.pubDate },
        { label: "URL", value: `<a href="${job.url}" target="_blank">View Listing</a>` }
      ];

      details.forEach(item => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <th>${item.label}</th>
          <td>${item.value || 'N/A'}</td>
        `;
        detailsBody.appendChild(row);
      });
    }

    window.onload = loadJobs;
  </script>
</head>
<body>

<h2>Master-Detail View: Java Remote Jobs</h2>

<div class="container">

  <div>
    <label for="jobSelect"><strong>Select Job Title (Master List):</strong></label>
    <select id="jobSelect" onchange="showJobDetails()">
      <option value="">-- Select a Job Title --</option>
    </select>
  </div>

  <div>
    <h3>Job Details</h3>
    <table id="jobDetailsTable">
      <tbody>
      <tr>
        <td>Select a job from the list above to view details.</td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

</body>
</html>
