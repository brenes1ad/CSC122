<!DOCTYPE html>
<html>
<head>
  <title>College Application Form</title>
</head>
<body>
<div class='section1'>
  <h1>College Application Form</h1>
  <p>Please fill out the form below to submit your application.</p>
  <br>

  <form onsubmit="event.preventDefault(); alert('Application Submitted!');">
    <fieldset>
      <legend>Personal Details</legend>

      <label for="fname">First name:</label>
      <input type="text" id="fname" name="firstName"/>
      <br><br>

      <label for="lname">Last name:</label>
      <input type="text" id="lname" name="lastName"/>
      <br><br>

      <label>Gender :</label>
      <input type="radio" id="male" name="gender" value="male"/>
      <label for="male">Male</label>
      <input type="radio" id="female" name="gender" value="female"/>
      <label for="female">Female</label>
      <br><br>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email"/>
      <br><br>

      <label for="dob">Date of Birth:</label>
      <input type="date" id="dob" name="dob"/>
      <br><br>

      <label for="major">Intended Major:</label>
      <input type="text" id="major" name="intendedMajor"/>
      <br><br>

      <label for="gpa">Unweighted GPA:</label>
      <input type="text" id="gpa" name="unweightedGPA"/>
      <br><br>

      <label for="extracurriculars">Extracurriculars:</label><br>
      <textarea id="extracurriculars" rows="5" name="extracurriculars"></textarea>
      <br><br>

      <input type="submit" value="Submit">
    </fieldset>
  </form>

</div>
</body>
</html>
