<!DOCTYPE html>
<html>
<head>
  <title>College Application Form</title>
</head>
<body>
<div class='section1'>
  <img src="../src/images/universityLogo.jpg" width="200" height="200"/>
  <h1>College Application Form</h1>
  <p>Please fill out the form below to submit your application.</p>
  <br>

  <form name="myForm" onsubmit="return validateForm()">
    <fieldset>
      <legend>Personal Details</legend>


      <label for="fname">First name:</label>
      <input type="text" id="fname" name="firstName"/>
      <br><br>

      <label for="lname">Last name:</label>
      <input type="text" id="lname" name="lastName"/>
      <br><br>

      <label for="address">Address:</label>
      <textarea id="address" rows="5" name="address"></textarea>
      <br><br>

      <label>Gender :</label>
      <input type="radio" id="male" name="gender" value="male"/>
      <label for="male">Male</label>
      <input type="radio" id="female" name="gender" value="female"/>
      <label for="female">Female</label>
      <br><br>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email"/>
      <br><br>

      <label for="dob">Date of Birth:</label>
      <input type="date" id="dob" name="dob"/>
      <br><br>

      <label for="major">Intended Major:</label>
      <input type="text" id="major" name="intendedMajor"/>
      <br><br>

      <label for="gpa">Unweighted GPA:</label>
      <input type="text" id="gpa" name="unweightedGPA"/>
      <br><br>

      <label for="extracurriculars">Extracurriculars:</label><br>
      <textarea id="extracurriculars" rows="5" name="extracurriculars"></textarea>
      <br><br>

      <input type="submit" value="Submit">
    </fieldset>
  </form>

</div>
</body>

<script>
  function validateForm() {
    validForm = true
    let x = document.forms["myForm"]["fname"].value;
    if (x.trim() == "") {
      alert("First Name must be filled out!")
      validForm = false
    }
    let y = document.forms["myForm"]["lname"].value;
    if (y.trim() == "") {
      alert("Last Name must be filled out!")
      validForm = false
    }
    let z = document.getElementById("address").value
    if (z.trim() == "") {
      alert("Address must be filled out!")
      validForm = false
    }
    let a = document.forms["myForm"]["email"].value;
    if (a.trim() == "") {
      alert("Email must be filled out!")
      validForm = false
    }
    return validForm

  }


</script>
</html>
