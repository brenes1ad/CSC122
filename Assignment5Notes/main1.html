<!DOCTYPE html>
<html>
<head>
  <script>
    async function loadRankings() {
      const response = await fetch( "https://corsproxy.io/?key=ec448aeb&url=https://ncaa-api.henrygd.me/rankings/football/fbs/associated-press")
      const resp = await response.json();
      const tbody = document.querySelector("#rankingsTable tbody");
      resp.data.forEach(team => {
        const row = document.createElement("tr");
        row.innerHTML = `
<td>${team.RANK}</td>
<td>${team.SCHOOL}</td>
<td>${team.RECORD}</td>
<td>${team.POINTS}</td>
<td>${team.PREVIOUS}</td>`;
        tbody.appendChild(row);
      });
    }


  </script>
</head>
<body>
<h2>AP Top 25 (NCAA Football)</h2>
<form>
  <button type="button" onclick="loadRankings()" >Show Ranking</button>
</form>
<table id="rankingsTable">
  <thead>
  <tr>
    <th>Rank</th>
    <th>Team</th>
    <th>Record</th>
    <th>Points</th>
    <th>Previous</th>
  </tr>
  </thead>
  <tbody></tbody>
</table></body></html>
